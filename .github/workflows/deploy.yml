
name: Deploy Portfolio to VMware

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portfolio-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and Deploy
    runs-on: [self-hosted, linux, x64]

    steps:
      # 1. Lấy source code mới nhất
      - name: Checkout source
        uses: actions/checkout@v6

      # 2. Cấu hình Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      # 3. Cài dependencies
      - name: Install dependencies
        run: npm ci

      # 4. Xóa toàn bộ thư mục dist cũ
      - name: Clean dist
        run: |
          echo "Cleaning old dist..."
          rm -rf -- "$GITHUB_WORKSPACE/dist"
          echo "Dist cleaned successfully!"

      # 5. Build lại từ đầu
      - name: Build React
        run: |
          echo "Building portfolio..."
          npm run build
          echo "Build completed!"

      # 6. Kiểm tra kết quả build
      - name: Verify build
        run: |
          test -f dist/index.html
          echo "Build output verified!"

      # 7. Deploy sang Nginx
      - name: Deploy to Nginx
        run: |
          rsync -av --delete dist/ /var/www/my-website/

      # 8. Kiểm tra website
      - name: Verify deployment
        run: |
          curl --fail http://127.0.0.1:8080/ -o /dev/null
